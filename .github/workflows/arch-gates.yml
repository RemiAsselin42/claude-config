# arch-gates — reusable workflow: import cycles and layer contracts, backend and frontend.
#
# The logic comes from claude-config at the pinned tag (gates/python/check_imports.py,
# the dependency-cruiser and grimp versions, the flags below); only the declarations
# stay in the repo: <backend>/arch-gates.json, <frontend>/.dependency-cruiser.cjs and
# the baselines next to them, all protected by hooks/protect-gates.js and the
# baseline-ratchet workflow. Call it with one job, leaving out the side a repo lacks:
#
#   name: arch-gates
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     arch:
#       uses: RemiAsselin42/claude-config/.github/workflows/arch-gates.yml@v2
#       with:
#         python-config: backend/arch-gates.json
#         frontend-dir: frontend
#
# Checks reported: "arch / python" and "arch / frontend" (a side left out is skipped,
# which a required check accepts). Make both required on main.
name: arch-gates
on:
  workflow_call:
    inputs:
      python-config:
        description: path to the backend's arch-gates.json; empty skips the Python gates
        type: string
        default: ""
      frontend-dir:
        description: directory holding src/ and .dependency-cruiser.cjs; empty skips the frontend gates
        type: string
        default: ""
jobs:
  python:
    if: inputs.python-config != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The gate script at this workflow's own commit, never the caller's branch
      # (same mechanism as baseline-ratchet.yml).
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .arch-gates
          sparse-checkout: gates/python/check_imports.py
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v4
      # grimp parses the files statically: the project's own dependencies are not installed.
      - name: Import cycles
        env:
          CONFIG: ${{ inputs.python-config }}
        run: uv run --no-project --python 3.12 --with grimp==3.14 python .arch-gates/gates/python/check_imports.py cycles --config "$CONFIG"
      - name: Layer contracts
        if: success() || failure()
        env:
          CONFIG: ${{ inputs.python-config }}
        run: uv run --no-project --python 3.12 --with grimp==3.14 python .arch-gates/gates/python/check_imports.py layers --config "$CONFIG"

  frontend:
    if: inputs.frontend-dir != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.frontend-dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned here, not in the repo's package.json. No project install: the
      # imports between the repo's own files are all the rules look at, and
      # typescript sits next to dependency-cruiser so .ts files are parsed.
      - name: Import cycles and layer contracts
        run: npx --yes -p dependency-cruiser@17.4.3 -p typescript@5.9.3 depcruise src --config .dependency-cruiser.cjs --ignore-known
