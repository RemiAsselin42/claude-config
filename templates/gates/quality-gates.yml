# Cyclomatic complexity and duplication may only shrink. The gate logic comes from
# claude-config at the pinned tag; this repo keeps complexity-baseline.json and
# duplication-baseline.json next to each side's pyproject.toml / package.json, and
# this caller with only the job(s) of the sides it has. The tools run with the rule
# imposed on the command line: the repo's ruff and eslint configurations stay as they
# are, no noqa, no eslint-disable. Add .quality-* to .gitignore (the reports).
name: quality-gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality-python:
    uses: RemiAsselin42/claude-config/.github/workflows/quality-python.yml@v6
    with:
      dir: backend
      package: app
  quality-frontend:
    uses: RemiAsselin42/claude-config/.github/workflows/quality-frontend.yml@v6
    with:
      dir: frontend
