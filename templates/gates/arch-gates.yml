# Import cycles and layer contracts. The gate logic comes from claude-config at the
# pinned tag; this repo only declares its layers and baselines. Created by /init-gates
# with only the job(s) of the sides the repo has: a side the repo lacks has no job, so
# nothing shows as skipped, and a required check can only go missing (which blocks),
# never be skipped past.
name: arch-gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  arch-python:
    uses: RemiAsselin42/claude-config/.github/workflows/arch-gates-python.yml@v6
    with:
      config: backend/arch-gates.json
  arch-frontend:
    uses: RemiAsselin42/claude-config/.github/workflows/arch-gates-frontend.yml@v6
    with:
      dir: frontend
